<script>
        function handleAction(type) {
            // Save intent
            localStorage.setItem('malaria_analysis_intent', type);
            
            // Visual feedback before navigation
            document.body.classList.add('transition-transform-slide', '-translate-x-full', 'opacity-0');
            
            // Simulated navigation delay
            setTimeout(() => {
                console.log(`Navigating to ${type} workflow...`);
                // window.location.href = '/analysis'; // Normally would navigate
                
                // Reset for demo purposes
                setTimeout(() => {
                     document.body.classList.remove('-translate-x-full', 'opacity-0');
                     alert(`Intent '${type}' saved. Transitioning to clinical interface...`);
                }, 500);
            }, 400);
        }
